apiVersion: v1
kind: ConfigMap
metadata:
  name: automarket-config
  namespace: automarket
data:
  DB_URL: "jdbc:postgresql://postgres:5432/automarket"
  # The JWT verification key. In the ConfigMap and not a Secret on purpose: it
  # is the public half, it verifies but cannot sign, and keeping it here makes
  # it obvious that only automarket-jwt-secret (auth-service) is sensitive.
  JWT_PUBLIC_KEY: ""
  DB_USERNAME: "automarket"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-0.kafka.automarket.svc.cluster.local:9092"
  MAIL_PROVIDER: "smtp"
  MAIL_HOST: "mailhog"
  MAIL_PORT: "1025"
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  MAIL_FROM: "noreply@automarket.com"
  FRONTEND_URL: "http://automarket.local"
  # Uploads go to MinIO over S3, not to a mounted volume — see
  # k8s/infrastructure/minio-statefulset.yml for why.
  STORAGE_PROVIDER: "s3"
  S3_BUCKET: "uploads"
  S3_ENDPOINT: "http://minio:9000"
  S3_PATH_STYLE: "true"
  S3_REGION: "eu-central-1"
  # Browsers fetch objects through the ingress, which proxies /uploads to MinIO.
  # The bucket is named "uploads" so the path MinIO sees is /uploads/<key> —
  # keeping the public URL byte-identical to the old local-storage one.
  CDN_URL: "http://automarket.local/uploads"
  STRIPE_ENABLED: "false"
  AUTH_SERVICE_URL: "http://auth-service:8081"
  LISTING_SERVICE_URL: "http://listing-service:8082"
  BLOG_SERVICE_URL: "http://blog-service:8083"
  INQUIRY_SERVICE_URL: "http://inquiry-service:8084"
  PAYMENT_SERVICE_URL: "http://payment-service:8086"
