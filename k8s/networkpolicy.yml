# ──────────────────────────────────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notification-service-allow-scrape
  namespace: automarket
spec:
  podSelector:
    matchLabels:
      app: notification-service
  policyTypes:
    - Ingress
  ingress:
    # notification-service has no HTTP clients: it consumes Kafka and sends
    # mail. Only the scraper and the kubelet need to reach it.
    # Prometheus scrapes /actuator/prometheus on the same port.
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8087
