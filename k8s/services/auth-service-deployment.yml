apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: automarket
spec:
  replicas: 1
  # Bring the replacement up before retiring the old pod. At one
  # replica the default (maxUnavailable: 25% -> 1) means a gap.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      # Must exceed spring.lifecycle.timeout-per-shutdown-phase (30s).
      terminationGracePeriodSeconds: 45
      containers:
        - name: auth-service
          image: automarket/automarket-auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: automarket-config
            - secretRef:
                name: automarket-secret
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
