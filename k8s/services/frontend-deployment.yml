apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: automarket
spec:
  replicas: 1
  # Bring the replacement up before retiring the old pod. At one
  # replica the default (maxUnavailable: 25% -> 1) means a gap.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # Must exceed spring.lifecycle.timeout-per-shutdown-phase (30s).
      terminationGracePeriodSeconds: 45
      containers:
        - name: frontend
          image: automarket/automarket-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
