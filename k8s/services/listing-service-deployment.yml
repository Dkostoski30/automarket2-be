apiVersion: apps/v1
kind: Deployment
metadata:
  name: listing-service
  namespace: automarket
spec:
  replicas: 1
  # Bring the replacement up before retiring the old pod. At one
  # replica the default (maxUnavailable: 25% -> 1) means a gap.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: listing-service
  template:
    metadata:
      labels:
        app: listing-service
    spec:
      # No volumes: uploads go to MinIO over S3. A ReadWriteOnce PVC here meant
      # the HPA below could never actually place a second replica on another node.
      # Must exceed spring.lifecycle.timeout-per-shutdown-phase (30s).
      terminationGracePeriodSeconds: 45
      containers:
        - name: listing-service
          image: automarket/automarket-listing-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: automarket-config
            - secretRef:
                name: automarket-secret
            - secretRef:
                name: automarket-storage-secret
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
