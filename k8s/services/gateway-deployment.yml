apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: automarket
spec:
  replicas: 1
  # Bring the replacement up before retiring the old pod. At one
  # replica the default (maxUnavailable: 25% -> 1) means a gap.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      # Must exceed spring.lifecycle.timeout-per-shutdown-phase (30s).
      terminationGracePeriodSeconds: 45
      containers:
        - name: gateway
          image: automarket/automarket-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: automarket-config
            - secretRef:
                name: automarket-secret
          env:
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8081"
            - name: LISTING_SERVICE_URL
              value: "http://listing-service:8082"
            - name: BLOG_SERVICE_URL
              value: "http://blog-service:8083"
            - name: INQUIRY_SERVICE_URL
              value: "http://inquiry-service:8084"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:8086"
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
