apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: automarket
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        # Fixed uid: provisioned dashboards reference the datasource by uid, and
        # without this Grafana generates a random one on every fresh volume.
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
