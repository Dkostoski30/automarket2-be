# S3-compatible object storage for uploads.
#
# listing-service and blog-service previously wrote uploads to a ReadWriteOnce
# PVC while their HPAs scaled them to 3 replicas. On this single-node k3d cluster
# that happens to work; on any multi-node cluster the second pod cannot mount the
# volume, so scale-out never schedules and a maxUnavailable:0 rollout deadlocks.
# Moving the files behind an S3 endpoint makes both services genuinely stateless,
# which is what the HPAs already assumed.
#
# MinIO rather than AWS so the cluster stays self-contained and the thesis demo
# runs offline. The application code does not know the difference — only
# automarket.storage.s3.endpoint changes.
#
# A StatefulSet, not a Deployment: this is the one pod in the pair that genuinely
# owns state, and it needs a stable volume claim.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: automarket
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2024-06-13T22-53-53Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: automarket-storage-secret
                  key: S3_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: automarket-storage-secret
                  key: S3_SECRET_KEY
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
