# Headless service: gives the broker a stable DNS name
# (kafka-0.kafka.automarket.svc.cluster.local) that matches its advertised listener.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: automarket
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: internal
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
