# Creates the uploads bucket and makes it anonymously readable.
#
# MinIO does not create buckets on demand, so without this every upload fails
# with NoSuchBucket. Anonymous download is what lets the frontend use a plain
# <img src> against the ingress; the alternative is presigned URLs, which would
# mean a round trip to the owning service for every image on a search page.
#
# Only GET is opened. Writes still require the root credentials, which only the
# two upload services hold.
#
# backoffLimit gives MinIO time to finish starting; the job is idempotent
# (--ignore-existing), so re-running deploy.sh is harmless.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: automarket
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-06-12T14-34-03Z
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: automarket-storage-secret
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: automarket-storage-secret
                  key: S3_SECRET_KEY
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mc alias set local http://minio:9000 "$S3_ACCESS_KEY" "$S3_SECRET_KEY"
              mc mb --ignore-existing local/uploads
              mc anonymous set download local/uploads
              echo "bucket 'uploads' ready"
