apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: automarket-ingress
  namespace: automarket
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: automarket.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          # Uploaded media is served straight from MinIO rather than through
          # the gateway: it is public, static, and routing it through a JWT
          # filter would put every image on a listing page behind the edge.
          # The bucket is called "uploads", so the prefix maps 1:1 onto it.
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
