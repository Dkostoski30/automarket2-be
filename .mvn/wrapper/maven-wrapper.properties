# Pins the build to one Maven version for everyone: local, CI and the images.
#
# only-script distribution — mvnw downloads and runs Maven directly, so there
# is no maven-wrapper.jar to commit. That matters here because .gitignore has a
# blanket *.jar rule that would otherwise silently exclude it.
wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
