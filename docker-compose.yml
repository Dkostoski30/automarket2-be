services:

  # ──────────────────────────────────────────
  # PostgreSQL
  # ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: automarket
      POSTGRES_USER: automarket
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automarket -d automarket"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Moves a database created before the schema split into one schema per
  # service (db/schema-split/cutover.sql), once. The five database services wait
  # for it; on a fresh or already-split database it exits straight away. The
  # cutover refuses to run while an old container is still connected — stop
  # them first if you are upgrading a running stack.
  db-schema-split:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: automarket
      PGPASSWORD: secret
      PGDATABASE: automarket
    volumes:
      - ./db/schema-split:/scripts:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$$(psql -tAc "SELECT to_regclass('public.flyway_history_auth') IS NOT NULL")" != "t" ]; then
          echo "no pre-split layout — nothing to do"
          exit 0
        fi
        echo "pre-split database — moving each service into its own schema"
        psql -v ON_ERROR_STOP=1 -f /scripts/cutover.sql || {
          echo "cutover rolled back, database unchanged. If services are still running:"
          echo "  docker compose stop auth-service listing-service blog-service inquiry-service payment-service"
          echo "then run docker compose up again."
          exit 1
        }

  # ──────────────────────────────────────────
  # Redis
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 48m
    command: ["redis-server", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # MinIO (S3-compatible object storage)
  #
  # listing-service and blog-service used to write uploads to a mounted volume,
  # which made them stateful: two replicas had two different sets of files. They
  # now speak S3 to this, so the only difference between here and AWS is the
  # endpoint. Console → http://localhost:9001 (minioadmin/minioadmin)
  # ──────────────────────────────────────────
  minio:
    image: quay.io/minio/minio:RELEASE.2024-06-13T22-53-53Z
    restart: unless-stopped
    mem_limit: 512m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the bucket and makes it anonymously readable, so <img src> works
  # without presigned URLs. Runs once and exits; that is why it has no restart
  # policy and nothing depends_on its completion beyond the healthcheck above.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-06-12T14-34-03Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-uploads} &&
      mc anonymous set download local/${S3_BUCKET:-uploads} &&
      echo 'bucket ready'
      "

  # Moves uploads written before the switch to MinIO (listing-service's old
  # uploads_data volume) into the bucket, then empties the volume so later runs
  # are no-ops. The volume is only emptied if every file arrived intact; on a
  # failure it is left untouched and the next `docker compose up` retries.
  # Storage keys were paths under /app/uploads and are the S3 keys unchanged,
  # so image URLs already in the database keep working.
  uploads-migrate:
    image: quay.io/minio/mc:RELEASE.2024-06-12T14-34-03Z
    depends_on:
      minio-init:
        condition: service_completed_successfully
    volumes:
      - uploads_data:/old
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -z "$$(ls -A /old)" ]; then echo "no old uploads to migrate"; exit 0; fi
        mc alias set local http://minio:9000 "${S3_ACCESS_KEY:-minioadmin}" "${S3_SECRET_KEY:-minioadmin}"
        mc mirror --overwrite /old "local/${S3_BUCKET:-uploads}"
        # The mc image has no grep/find. '<' = only on disk, '!' = differs;
        # '>' (only in the bucket) is expected — uploads made since the switch.
        mc diff /old "local/${S3_BUCKET:-uploads}" > /tmp/diff || true
        missing=0
        while read -r flag path; do
          case "$$flag" in "<"*|"!"*) missing=$$((missing + 1)); echo "not copied: $$path" ;; esac
        done < /tmp/diff
        if [ "$$missing" != "0" ]; then echo "$$missing file(s) did not arrive intact, volume kept"; exit 1; fi
        rm -rf /old/* /old/.[!.]* 2>/dev/null || true
        echo "old uploads moved to MinIO"

  # ──────────────────────────────────────────
  # Kafka (event bus for microservices) — single-node KRaft, no ZooKeeper
  # Management UI → http://localhost:15672 (guest/guest)
  # ──────────────────────────────────────────
  kafka:
    image: apache/kafka:3.7.1
    restart: unless-stopped
    mem_limit: 1g
    environment:
      # Single-node KRaft: this one container is both broker and controller,
      # so there is no ZooKeeper to run alongside it.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Two listeners: INTERNAL for other compose services, EXTERNAL published on
      # the host so a service started from the IDE can reach localhost:9092.
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      # Single broker, so every internal topic must be replication factor 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ──────────────────────────────────────────
  # Kafka UI (browse topics, messages, consumer lag)
  # ──────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    mem_limit: 256m
    environment:
      KAFKA_CLUSTERS_0_NAME: automarket
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
  # ──────────────────────────────────────────
  # MailHog (dev SMTP + web UI)
  # ──────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    mem_limit: 32m
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI → http://localhost:8025

  # ──────────────────────────────────────────
  # Prometheus (metrics scraping) — optional
  # Start with: docker compose --profile monitoring up
  # UI → http://localhost:9090
  # ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    mem_limit: 96m
    profiles: ["monitoring"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=256MB"

  # ──────────────────────────────────────────
  # Grafana (dashboards) — optional
  # Start with: docker compose --profile monitoring up
  # UI → http://localhost:3000 (admin/admin)
  # ──────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    mem_limit: 96m
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # ──────────────────────────────────────────
  # Auth Service (port 8081)
  # Owns: users, roles, refresh_tokens, JWT, auth
  # ──────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    env_file:
      - .env
    ports:
      - "8081:8081"
    depends_on:
      db-schema-split:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ──────────────────────────────────────────
  # Listing Service (port 8082)
  # Owns: listings, images, favorites, analytics, moderation, reference data
  # ──────────────────────────────────────────
  listing-service:
    build:
      context: .
      dockerfile: listing-service/Dockerfile
    restart: unless-stopped
    mem_limit: 300m
    env_file:
      - .env
    ports:
      - "8082:8082"
    depends_on:
      db-schema-split:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ──────────────────────────────────────────
  # Blog Service (port 8083)
  # ──────────────────────────────────────────
  blog-service:
    build:
      context: .
      dockerfile: blog-service/Dockerfile
    restart: unless-stopped
    mem_limit: 200m
    env_file:
      - .env
    ports:
      - "8083:8083"
    depends_on:
      db-schema-split:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  # ──────────────────────────────────────────
  # Inquiry Service (port 8084)
  # Owns: inquiries
  # ──────────────────────────────────────────
  inquiry-service:
    build:
      context: .
      dockerfile: inquiry-service/Dockerfile
    restart: unless-stopped
    mem_limit: 210m
    env_file:
      - .env
    ports:
      - "8084:8084"
    depends_on:
      db-schema-split:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  # ──────────────────────────────────────────
  # Payment Service (port 8086)
  # Owns: subscriptions, Stripe integration
  # ──────────────────────────────────────────
  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    restart: unless-stopped
    mem_limit: 220m
    env_file:
      - .env
    ports:
      - "8086:8086"
    depends_on:
      db-schema-split:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  # ──────────────────────────────────────────
  # Notification Service (port 8087)
  # No DB. Pure event consumer via Kafka.
  # ──────────────────────────────────────────
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    restart: unless-stopped
    mem_limit: 160m
    env_file:
      - .env
    ports:
      - "8087:8087"
    depends_on:
      kafka:
        condition: service_healthy
      mailhog:
        condition: service_started

  # ──────────────────────────────────────────
  # API Gateway (port 8080 — FE entry point)
  # ──────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    mem_limit: 220m
    env_file:
      - .env
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      LISTING_SERVICE_URL: http://listing-service:8082
      BLOG_SERVICE_URL: http://blog-service:8083
      INQUIRY_SERVICE_URL: http://inquiry-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8086
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      listing-service:
        condition: service_healthy
      blog-service:
        condition: service_healthy
      inquiry-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  kafka_data:
  # Only mounted by uploads-migrate, which moves anything left in it into
  # MinIO and empties it. Safe to delete once that has run:
  #   docker volume rm <project>_uploads_data
  uploads_data:
  prometheus_data:
  grafana_data:
