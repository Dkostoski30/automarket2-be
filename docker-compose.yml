services:

  # ──────────────────────────────────────────
  # PostgreSQL
  # ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: automarket
      POSTGRES_USER: automarket
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automarket -d automarket"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ──────────────────────────────────────────
  # Redis
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 48m
    command: ["redis-server", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # RabbitMQ (event bus for microservices)
  # Management UI → http://localhost:15672 (guest/guest)
  # ──────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    mem_limit: 200m
    environment:
      RABBITMQ_DEFAULT_USER: automarket
      RABBITMQ_DEFAULT_PASS: secret
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit vm_memory_high_watermark 0.5"
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ──────────────────────────────────────────
  # MailHog (dev SMTP + web UI)
  # ──────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    mem_limit: 32m
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI → http://localhost:8025

  # ──────────────────────────────────────────
  # Prometheus (metrics scraping) — optional
  # Start with: docker compose --profile monitoring up
  # UI → http://localhost:9090
  # ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    mem_limit: 96m
    profiles: ["monitoring"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=256MB"

  # ──────────────────────────────────────────
  # Grafana (dashboards) — optional
  # Start with: docker compose --profile monitoring up
  # UI → http://localhost:3000 (admin/admin)
  # ──────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    mem_limit: 96m
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # ──────────────────────────────────────────
  # Auth Service (port 8081)
  # Owns: users, roles, refresh_tokens, JWT, auth
  # ──────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    env_file:
      - .env
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ──────────────────────────────────────────
  # Listing Service (port 8082)
  # Owns: listings, images, favorites, analytics, moderation, reference data
  # ──────────────────────────────────────────
  listing-service:
    build:
      context: .
      dockerfile: listing-service/Dockerfile
    restart: unless-stopped
    mem_limit: 300m
    env_file:
      - .env
    ports:
      - "8082:8082"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ──────────────────────────────────────────
  # Blog Service (port 8083)
  # ──────────────────────────────────────────
  blog-service:
    build:
      context: .
      dockerfile: blog-service/Dockerfile
    restart: unless-stopped
    mem_limit: 200m
    env_file:
      - .env
    ports:
      - "8083:8083"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # ──────────────────────────────────────────
  # Inquiry Service (port 8084)
  # Owns: inquiries
  # ──────────────────────────────────────────
  inquiry-service:
    build:
      context: .
      dockerfile: inquiry-service/Dockerfile
    restart: unless-stopped
    mem_limit: 210m
    env_file:
      - .env
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ──────────────────────────────────────────
  # Payment Service (port 8086)
  # Owns: subscriptions, Stripe integration
  # ──────────────────────────────────────────
  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    restart: unless-stopped
    mem_limit: 220m
    env_file:
      - .env
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ──────────────────────────────────────────
  # Notification Service (port 8087)
  # No DB. Pure event consumer via RabbitMQ.
  # ──────────────────────────────────────────
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    restart: unless-stopped
    mem_limit: 160m
    env_file:
      - .env
    ports:
      - "8087:8087"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started

  # ──────────────────────────────────────────
  # API Gateway (port 8080 — FE entry point)
  # ──────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    mem_limit: 220m
    env_file:
      - .env
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      LISTING_SERVICE_URL: http://listing-service:8082
      BLOG_SERVICE_URL: http://blog-service:8083
      INQUIRY_SERVICE_URL: http://inquiry-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8086
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      listing-service:
        condition: service_healthy
      blog-service:
        condition: service_healthy
      inquiry-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  prometheus_data:
  grafana_data:
