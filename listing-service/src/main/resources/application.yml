server:
  port: 8082

  # Finish in-flight requests instead of dropping them when the pod gets SIGTERM.
  # Without this a rolling update returns connection resets, and a Kafka listener
  # can be killed mid-batch — safe for the idempotent projections, but it leaves
  # auth-service's subscription consumer leaning on its inbox table for what should
  # be an orderly stop.
  shutdown: graceful
spring:
  lifecycle:
    # Must stay below the pod's terminationGracePeriodSeconds (45s).
    timeout-per-shutdown-phase: 30s
  application:
    name: listing-service
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/automarket}
    username: ${DB_USERNAME:automarket}
    password: ${DB_PASSWORD:secret}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    # Shared PostgreSQL schema: each service needs its OWN Flyway history table.
    # With the default (flyway_schema_history) the first service to start records
    # its V1__baseline and every other service then fails with a checksum
    # mismatch on version 1 and never boots.
    table: flyway_history_listing
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      # Carries the trace context into the Kafka headers, so a
      # consumer's log lines share the producer's trace id.
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # acks=all + idempotence: no silent message loss on broker failover,
      # and retries cannot produce duplicates from the producer side.
      acks: all
      retries: 5
      properties:
        # Consumers read with StringDeserializer, so the serializer's type headers
        # would be dead weight on every record.
        spring.json.add.type.headers: false
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: listing-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      observation-enabled: true
      ack-mode: record
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

automarket:
  gateway:
    # Proves to each service that a request came through the gateway, which is the
    # only component that validates a JWT. Without it the X-User-* headers are
    # self-asserted and any pod could claim ROLE_ADMIN.
    shared-secret: ${GATEWAY_SHARED_SECRET:dev-insecure-gateway-secret}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local:
      upload-dir: ${LOCAL_UPLOAD_DIR:./uploads}
      base-url: ${LOCAL_BASE_URL:http://localhost:8080/uploads}
    s3:
      bucket: ${S3_BUCKET:uploads}
      cdn-url: ${CDN_URL:http://localhost:9000/uploads}
      # Blank endpoint = real AWS. Set to the MinIO service in-cluster; MinIO
      # cannot do virtual-host addressing, hence path-style alongside it.
      endpoint: ${S3_ENDPOINT:}
      path-style: ${S3_PATH_STYLE:false}
      region: ${S3_REGION:eu-central-1}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
  listings:
    max-per-free-user: 3
    max-images-per-listing: 10
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:4200}

management:
  tracing:
    sampling:
      # Sample everything. There is no exporter, so a span costs a MDC entry and
      # nothing else — and a trace id that exists on only 10% of requests is worse
      # than useless when chasing one registration through five projections.
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
