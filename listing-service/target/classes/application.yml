server:
  port: 8082

spring:
  application:
    name: listing-service
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/automarket}
    username: ${DB_USERNAME:automarket}
    password: ${DB_PASSWORD:secret}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:automarket}
    password: ${RABBITMQ_PASSWORD:secret}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

automarket:
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local:
      upload-dir: ${LOCAL_UPLOAD_DIR:./uploads}
      base-url: ${LOCAL_BASE_URL:http://localhost:8080/uploads}
    s3:
      bucket: ${S3_BUCKET:automarket-uploads}
      cdn-url: ${CDN_URL:https://cdn.automarket.com}
  listings:
    max-per-free-user: 3
    max-images-per-listing: 10
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
