name: CI

# Pull requests are checked too. Previously only pushes to two branches ran
# anything, so nothing was verified before a merge.
on:
  push:
    branches: [master, feature/devops-setup]
    paths-ignore: ['**/*.md', '*.pdf']
  pull_request:
    branches: [master]
    paths-ignore: ['**/*.md', '*.pdf']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Compile and test ────────────────────────────────────────────
  # The image builds below pass -DskipTests, so without this job nothing ever
  # compiles a test source file, let alone runs one.
  verify:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Testcontainers needs a Docker daemon; ubuntu-latest provides one.
      - name: Verify
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore

  # ── Build the images ────────────────────────────────────────────
  # Deployment is local-build: k8s/deploy.sh builds and k3d-imports, and every
  # manifest is imagePullPolicy: Never. Nothing is pushed to a registry, so
  # these builds exist purely to prove each Dockerfile is still valid — the
  # whole matrix was broken and nothing noticed.
  #
  # Deliberately one job rather than a matrix: the /root/.m2 cache mount in the
  # Dockerfiles is shared across builds on the same builder, so only the first
  # image pays for dependency resolution. A matrix gives each service its own
  # builder and re-downloads everything seven times.
  images:
    name: Build images
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build all service images
        run: |
          set -euo pipefail
          for svc in gateway auth-service listing-service blog-service \
                     inquiry-service payment-service notification-service; do
            echo "::group::$svc"
            docker buildx build \
              --file "$svc/Dockerfile" \
              --tag "automarket/automarket-$svc:ci" \
              --output type=cacheonly \
              .
            echo "::endgroup::"
          done
