name: CI

on:
  push:
    branches: [master, feature/devops-setup]
    paths-ignore: ['**/*.md', '*.pdf']
  pull_request:
    branches: [master]
    paths-ignore: ['**/*.md', '*.pdf']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Compile only ────────────────────────────────────────────────
  # Build-only for now: tests and the per-service image builds are parked
  # until the suites/Dockerfiles are stable, so a commit fails CI only when
  # the code genuinely does not compile.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build
        run: ./mvnw -B --no-transfer-progress -DskipTests package
