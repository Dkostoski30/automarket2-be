global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spring-boot-actuator'
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets:
          - auth-service:8081
          - listing-service:8082
          - blog-service:8083
          - inquiry-service:8084
          - payment-service:8086
          - notification-service:8087
          - gateway:8080
