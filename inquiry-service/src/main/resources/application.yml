server:
  port: 8084

  # Finish in-flight requests instead of dropping them when the pod gets SIGTERM.
  # Without this a rolling update returns connection resets, and a Kafka listener
  # can be killed mid-batch — safe for the idempotent projections, but it leaves
  # auth-service's subscription consumer leaning on its inbox table for what should
  # be an orderly stop.
  shutdown: graceful
spring:
  lifecycle:
    # Must stay below the pod's terminationGracePeriodSeconds (45s).
    timeout-per-shutdown-phase: 30s
  application:
    name: inquiry-service
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/automarket}
    username: ${DB_USERNAME:automarket}
    password: ${DB_PASSWORD:secret}
    hikari:
      # search_path of every pooled connection: this service\'s own schema only.
      # Routes native queries (outbox claim etc.), which default_schema below
      # does not touch.
      schema: inquiry
      maximum-pool-size: 3
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: inquiry
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    # Each service owns one PostgreSQL schema; its tables and its history table
    # live there. Flyway creates the schema on a fresh database. An existing
    # database from before the split is moved here by db/schema-split/cutover.sql.
    default-schema: inquiry
    schemas: inquiry
    # Refuse to migrate a database that still has the old shared layout: Flyway
    # would find no history in `inquiry`, baseline, and create empty tables beside
    # the real ones. Runs on Flyway's connection before anything is created.
    init-sqls:
      - "DO $$ BEGIN IF to_regclass('public.flyway_history_inquiry') IS NOT NULL THEN RAISE EXCEPTION 'Database still has the shared public-schema layout. Run db/schema-split/cutover.sql first (k8s/deploy.sh and docker compose do this).'; END IF; END $$;"
    # Kept from the shared-schema era, when every service needed its own name;
    # the cutover moves the table under this name.
    table: flyway_history_inquiry
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      # Carries the trace context into the Kafka headers, so a
      # consumer's log lines share the producer's trace id.
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # acks=all + idempotence: no silent message loss on broker failover,
      # and retries cannot produce duplicates from the producer side.
      acks: all
      retries: 5
      properties:
        # Consumers read with StringDeserializer, so the serializer's type headers
        # would be dead weight on every record.
        spring.json.add.type.headers: false
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: inquiry-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      observation-enabled: true
      ack-mode: record
automarket:
  gateway:
    # Proves to each service that a request came through the gateway, which is the
    # only component that validates a JWT. Without it the X-User-* headers are
    # self-asserted and any pod could claim ROLE_ADMIN.
    shared-secret: ${GATEWAY_SHARED_SECRET:dev-insecure-gateway-secret}

management:
  tracing:
    sampling:
      # Sample everything. There is no exporter, so a span costs a MDC entry and
      # nothing else — and a trace id that exists on only 10% of requests is worse
      # than useless when chasing one registration through five projections.
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      # Split the aggregate health endpoint into liveness and readiness groups so
      # the Kubernetes probes can ask different questions. All three probes used
      # to hit /actuator/health, which aggregates DB, Redis and Kafka — meaning a
      # transient Postgres blip failed *liveness* and Kubernetes restarted every
      # replica of every service at once, which cannot fix a remote dependency and
      # hammers the database on recovery.
      probes:
        enabled: true
      group:
        # Liveness stays the Spring default (livenessState only): is this JVM
        # wedged? A dependency being down is never a reason to restart.
        # Readiness adds the datasource, because a pod that cannot reach Postgres
        # should leave the Service endpoints — but not be killed.
        readiness:
          include: readinessState,db
