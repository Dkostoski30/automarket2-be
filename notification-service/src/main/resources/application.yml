server:
  port: 8087

  # Finish in-flight requests instead of dropping them when the pod gets SIGTERM.
  # Without this a rolling update returns connection resets, and a Kafka listener
  # can be killed mid-batch — safe for the idempotent projections, but it leaves
  # auth-service's subscription consumer leaning on its inbox table for what should
  # be an orderly stop.
  shutdown: graceful
spring:
  lifecycle:
    # Must stay below the pod's terminationGracePeriodSeconds (45s).
    timeout-per-shutdown-phase: 30s
  application:
    name: notification-service

  config:
    import: "optional:file:.env[.properties]"

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      # Carries the trace context into the Kafka headers, so a
      # consumer's log lines share the producer's trace id.
      observation-enabled: true
    producer:
      # Needed by the dead-letter publisher in KafkaConfig.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        # Consumers read with StringDeserializer, so the serializer's type headers
        # would be dead weight on every record.
        spring.json.add.type.headers: false
    consumer:
      group-id: notification-service
      # Read from the beginning the first time this group appears, so events
      # published before the consumer existed are still delivered.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      observation-enabled: true
      ack-mode: record
      concurrency: 2
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

automarket:
  mail:
    # smtp = MailHog (dev default) | resend = Resend HTTP API (placeholder, sends nothing yet)
    provider: ${MAIL_PROVIDER:smtp}
    from: ${MAIL_FROM:noreply@automarket.com}
    resend:
      api-key: ${RESEND_API_KEY:}
  frontend:
    base-url: ${FRONTEND_URL:http://localhost:4200}

# Actuator
management:
  tracing:
    sampling:
      # Sample everything. There is no exporter, so a span costs a MDC entry and
      # nothing else — and a trace id that exists on only 10% of requests is worse
      # than useless when chasing one registration through five projections.
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.automarket.notification: DEBUG
