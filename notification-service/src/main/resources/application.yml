server:
  port: 8087

spring:
  application:
    name: notification-service

  config:
    import: "optional:file:.env[.properties]"

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Needed by the dead-letter publisher in KafkaConfig.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        # Consumers read with StringDeserializer, so the serializer's type headers
        # would be dead weight on every record.
        spring.json.add.type.headers: false
    consumer:
      group-id: notification-service
      # Read from the beginning the first time this group appears, so events
      # published before the consumer existed are still delivered.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: record
      concurrency: 2
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

automarket:
  mail:
    from: ${MAIL_FROM:noreply@automarket.com}
  frontend:
    base-url: ${FRONTEND_URL:http://localhost:4200}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.automarket.notification: DEBUG
