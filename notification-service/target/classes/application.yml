server:
  port: 8087

spring:
  application:
    name: notification-service

  config:
    import: "optional:file:.env[.properties]"

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:automarket}
    password: ${RABBITMQ_PASSWORD:secret}
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

automarket:
  mail:
    from: ${MAIL_FROM:noreply@automarket.com}
  frontend:
    base-url: ${FRONTEND_URL:http://localhost:4200}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.automarket.notification: DEBUG
