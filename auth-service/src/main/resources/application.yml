server:
  port: 8081

spring:
  application:
    name: auth-service
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/automarket}
    username: ${DB_USERNAME:automarket}
    password: ${DB_PASSWORD:secret}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:automarket}
    password: ${RABBITMQ_PASSWORD:secret}

automarket:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-must-be-at-least-32-chars}
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 2592000000
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
