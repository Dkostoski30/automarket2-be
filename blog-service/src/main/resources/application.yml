server:
  port: 8083

spring:
  application:
    name: blog-service

  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/automarket}
    username: ${DB_USERNAME:automarket}
    password: ${DB_PASSWORD:secret}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway disabled: monolith owns migrations during Phase 2 transition.
  flyway:
    enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

automarket:
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local:
      upload-dir: ${LOCAL_UPLOAD_DIR:./uploads}
      base-url: ${LOCAL_BASE_URL:http://localhost:8080/uploads}
    s3:
      bucket: ${S3_BUCKET:automarket-uploads}
      cdn-url: ${CDN_URL:https://cdn.automarket.com}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.automarket.blog: DEBUG
